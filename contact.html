<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Us – Catering Service</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="style.css"></head><body ><div id="prog"></div><header id="nav"></header><section class="hero2 "><img src="hero-contact.webp" alt="Decorative olive and beige banner for the Contact Us page (placeholder image)"><div class="in"><h1>Contact Us</h1><p>Placeholder: +91 00000 00000 | hello@example.com</p></div></section><main class="wrap"><div class="box w"><div class="msg ok" id="cok" hidden>Thanks! Your enquiry was received (demo, nothing is sent).</div><form id="cf" novalidate><label for="cn">Name</label><input id="cn" name="cn" type="text" data-v="name" aria-describedby="cn-e" ><p class="err" id="cn-e"></p><label for="ce">Email</label><input id="ce" name="ce" type="email" data-v="email" aria-describedby="ce-e" ><p class="err" id="ce-e"></p><label for="cm">Mobile</label><input id="cm" name="cm" type="tel" data-v="mobile" aria-describedby="cm-e" maxlength=10 inputmode=numeric><p class="err" id="cm-e"></p><label for="ct">Event type</label><select id="ct" data-v="req" aria-describedby="ct-e"><option value="">Select</option><option>Wedding</option><option>Corporate</option><option>Birthday / Party</option></select><p class="err" id="ct-e"></p><label for="cd">Event date</label><input id="cd" name="cd" type="date" data-v="date" aria-describedby="cd-e" ><p class="err" id="cd-e"></p><label for="cg">Guest count</label><input id="cg" name="cg" type="number" data-v="guests" aria-describedby="cg-e" ><p class="err" id="cg-e"></p><label for="cc">Venue city</label><input id="cc" name="cc" type="text" data-v="req" aria-describedby="cc-e" ><p class="err" id="cc-e"></p><label for="cx">Message</label><textarea id="cx" rows="4"></textarea><div class="esum err" hidden role="alert"></div><button class="btn" style="margin-top:16px">Send enquiry</button></form></div></main><section class="alt"><div class="wrap"><h2 class="reveal st">Reach us</h2><p class="sub2">All details are placeholders.</p><div class="cards"><div class="card reveal"><div class="ic">📞</div><h3>Phone</h3><p>+91 00000 00000</p></div><div class="card reveal"><div class="ic">✉️</div><h3>Email</h3><p>hello@example.com</p></div><div class="card reveal"><div class="ic">📍</div><h3>Address</h3><p>Placeholder Street, City</p></div><div class="card reveal"><div class="ic">🕘</div><h3>Hours</h3><p>Mon to Sat, 9 am to 7 pm</p></div></div></div></section><footer id=footer></footer><script src="script.js"></script></body></html>
